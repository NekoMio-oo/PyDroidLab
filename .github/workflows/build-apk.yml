name: Build PyDroidLab APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Read Python version from gradle.properties
        id: pyver
        run: |
          VER=$(grep -E "^pydroidlab\.pythonVersion=" gradle.properties | cut -d= -f2 | tr -d "[:space:]")
          echo "version=${VER:-3.13}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up matching buildPython for Chaquopy 17.1.0
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Compiled PyDroidLab APK
        uses: actions/upload-artifact@v4
        with:
          name: PyDroidLab-v1.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "PyDroidLab $GITHUB_REF_NAME" \
            --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" \
            app/build/outputs/apk/debug/app-debug.apk --clobber
