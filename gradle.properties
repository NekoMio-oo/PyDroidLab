org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# PyDroidLab custom build flags (Chaquopy 17.1.0):
# Supported Python versions in Chaquopy 17.1.0: 3.10 (3.10.22), 3.11 (3.11.17), 3.12 (3.12.15), 3.13 (3.13.16), 3.14 (3.14.8), 3.15 (3.15.0)
# Python 3.13 is used by default for modern syntax, 16KB page compatibility, and pre-compiled numpy/pandas wheel support.
pydroidlab.pythonVersion=3.13

# Set to true to pre-bundle C-extension scientific libraries (numpy, pandas) at build time via Chaquopy.
pydroidlab.preinstallScientific=true
