org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# PyDroidLab custom build flags:
# Set to true to pre-bundle C-extension scientific libraries (numpy, pandas) at build time via Chaquopy.
# Set to false for a lightweight APK (~25MB) that only includes standard library + requests at build time.
pydroidlab.preinstallScientific=true
