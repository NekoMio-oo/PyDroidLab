# Project-wide Gradle settings.
# 堆内存给得克制一些：Gradle 守护进程 + Kotlin 守护进程 + R8/D8 worker
# 会同时占用内存，4G 堆在一些受限的容器/CI 环境里会被 OOM Killer 干掉。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
org.gradle.caching=true
# Chaquopy 15 的 BuildPackagesTask 在 configuration-cache 序列化阶段会强制
# 初始化 sitePackages，从而报 "app/build/python/env/debug/lib does not exist"。
# 因此这里必须关闭配置缓存；构建缓存仍然开启。
org.gradle.configuration-cache=false
# Kotlin 2.0.x 与 Chaquopy 同时存在时，并行配置会在
# compileDebugKotlin 的 friendPathsSet 上抛
# "Current thread does not hold the state lock"，因此关闭并行。
org.gradle.parallel=false
org.gradle.daemon=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
